services:
  time_tracking:
    image: time-tracking
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - "9500:9500"
    environment:
      DataSource: "Postgres"
      ConnectionStrings__TimeTrackingPostgresql: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file, see .env.example};Database=TimeTracking;Include Error Detail=true;"
      ConnectionStrings__TimeTrackingSqlite: "DataSource=./test.db;"
      Token__Issuer: "TimeTracker"
      Token__Audience: "TimeTrackers"
      Token__SecretVariableName: "TokenSecret"
      # secrets are provided by the .env file next to this file, see .env.example
      TokenSecret: "${TokenSecret:?Set TokenSecret in the .env file, see .env.example}"

  postgres:
    image: postgres:latest
    networks:
      - app-network
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file, see .env.example}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=TimeTracking
    ports:
      - "5432:5432"
    healthcheck:
      # as postgres never reaches service_healthy state on its own, we use start_period 
      test: [ "CMD-SHELL", "pg_isready -U postgres -d TimeTracking" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s # Gives Postgres time to do its initial disk setup

networks:
  app-network:
    driver: bridge

